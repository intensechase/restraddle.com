name: Deploy

on:
  push:
    branches: [main]

# Build here, not on the server: the image goes to the private GitHub
# registry (ghcr.io), tagged with the commit ID; the server only pulls it.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/intensechase/restraddle:${{ github.sha }}
            ghcr.io/intensechase/restraddle:latest

      - name: Deploy to Hillsboro
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          # Short-lived: GITHUB_TOKEN expires when this run ends. Sent on stdin
          # so the server can pull the image; never stored there.
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST_KEY" >> ~/.ssh/known_hosts
          printf '%s\n' "$PULL_TOKEN" | ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@$HOST "bash /root/deploy-restraddle.sh ${{ github.sha }}"
