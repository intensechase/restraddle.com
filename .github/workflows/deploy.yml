name: Deploy

on:
  push:
    branches: [main]

# This job never checks out the repo or calls the GitHub API — it only
# uses the secrets below to SSH out and trigger a remote pull+build. The
# default GITHUB_TOKEN grant is broader than that needs, so drop it to
# nothing explicitly rather than relying on the (wider) repo default.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hillsboro
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@$HOST "bash /root/deploy-restraddle.sh"
